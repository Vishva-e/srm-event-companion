spring.application.name=srm-event-companion
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
spring.web.resources.cache.cachecontrol.no-store=true
server.error.include-message=never

# Embedded, file-backed H2; data survives application restarts.
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:./data/srm-event-companion;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${APP_DB_USERNAME:sa}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=false

# Sample placeholder only; NOT a deployed website. QR remains disabled until real URL is set.
# On deployment set APP_PUBLIC_URL=https://your-actual-domain.com/ (real HTTPS domain).
event.public-url=${APP_PUBLIC_URL:https://srm-event-companion.example/}
